<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Dashboard - Laporan Sales</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #020617; }
    .tv-canvas { width: 1920px; height: 1080px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; background-color: #eff6ff; overflow: hidden; }
    .dashboard-layout { display: flex; flex-direction: column; gap: 1rem; width: 100%; height: 100%; }
    .top-row { display: flex; flex-direction: row; justify-content: center; gap: 1.5rem; width: 100%; }
    .bottom-row { display: flex; flex-direction: row; justify-content: center; gap: 1.25rem; width: 100%; }
    .gauge-section-container { width: 500px; height: 380px; background: #fff; border-radius: 0.85rem; border: 1px solid #bfdbfe; display: flex; flex-direction: column; overflow: hidden; }
    .custom-table-container { width: 600px; height: 380px; display: flex; flex-direction: column; }
    .mtd-top1-container { width: 500px; height: 380px; background: #fff; border-radius: 1rem; display: flex; flex-direction: column; overflow: hidden; }
    .bottom-card-container { width: 440px; height: 340px; background: #fff; border-radius: 0.85rem; border: 1px solid #bfdbfe; display: flex; flex-direction: column; overflow: hidden; }
    @keyframes scrollUp { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(0, -50%, 0); } }
    .animate-scroll-infinite { animation: scrollUp linear infinite; will-change: transform; }
    .slider-track { display: flex; width: 300%; height: 100%; transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 select-none overflow-hidden m-0 p-0">

  <!-- OVERLAY AUDIOPLAY UNLOCK -->
  <div id="audioUnlockOverlay" onclick="unlockAndPlayAudio()" class="fixed inset-0 bg-slate-950/90 z-[9999999] flex flex-col items-center justify-center text-white cursor-pointer">
    <div class="bg-blue-600 hover:bg-blue-700 p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 animate-bounce">
      <i data-lucide="volume-2" class="w-16 h-16 text-yellow-300"></i>
      <h2 class="text-2xl font-black">KLIK UNTUK AKTIFKAN TV SOUND</h2>
    </div>
  </div>

  <!-- POPUP SALES OVERLAY -->
  <div id="salesPopupOverlay" class="fixed inset-0 z-[999999] bg-slate-950/90 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-500 scale-95">
    <div class="bg-white rounded-3xl p-8 max-w-2xl w-full flex flex-col items-center text-center border-4 border-yellow-400 shadow-2xl">
      <img id="popupFoto" src="" class="w-36 h-36 rounded-2xl border-4 border-blue-600 object-cover mb-4">
      <h2 id="popupNama" class="text-3xl font-black text-slate-900">-</h2>
      <div id="popupNip" class="text-xs font-mono font-bold text-blue-600 mb-4">NIP: -</div>
      <div class="grid grid-cols-3 gap-4 w-full">
        <div id="boxValueSales" class="bg-emerald-50 p-3 rounded-xl border border-emerald-200"><div class="text-xs font-bold text-emerald-700">VALUE SALES</div><div id="popupValueSales" class="text-lg font-black font-mono text-emerald-800">-</div></div>
        <div id="boxQtyFp" class="bg-blue-50 p-3 rounded-xl border border-blue-200"><div class="text-xs font-bold text-blue-700">QTY FP</div><div id="popupQtyFp" class="text-lg font-black font-mono text-blue-800">-</div></div>
        <div id="boxValueComser" class="bg-purple-50 p-3 rounded-xl border border-purple-200"><div class="text-xs font-bold text-purple-700">VALUE COMSER</div><div id="popupValueComser" class="text-lg font-black font-mono text-purple-800">-</div></div>
      </div>
    </div>
  </div>

  <audio id="audioBacksound" preload="auto" loop></audio>
  <audio id="audioSoundSales" preload="auto"></audio>

  <div class="w-full h-full p-[2.5%] box-border flex items-center justify-center">
    <div id="tvAspectRatioBox" class="w-full max-h-full flex items-center justify-center relative overflow-hidden" style="aspect-ratio: 70 / 39;">
      <div id="tvScaleCanvas" class="tv-canvas rounded-2xl shadow-2xl">

        <!-- HEADER -->
        <header class="bg-slate-900 border-b border-slate-800 px-10 py-3 flex justify-between items-center h-[80px]">
          <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2.5 rounded-2xl text-white"><i data-lucide="tv" class="w-7 h-7"></i></div>
            <div>
              <h1 class="text-2xl font-bold text-white">INFORMA MOG MALANG (J382)</h1>
              <p class="text-xs text-blue-400 font-medium">LIVE TV DASHBOARD - LAPORAN SALES</p>
            </div>
          </div>
          <div class="flex items-center gap-8">
            <div class="text-right">
              <div id="currentTime" class="text-3xl font-mono font-bold text-slate-100">00:00:00</div>
              <div id="currentDate" class="text-xs text-slate-400">-</div>
            </div>
          </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative bg-blue-50 px-6 py-2 flex items-center justify-center">
          <div class="dashboard-layout">
            <div class="top-row">
              <div class="gauge-section-container">
                <div class="bg-slate-900 text-white font-bold text-center py-2">TARGET TODAY</div>
                <div class="flex-1 flex flex-col items-center justify-center p-4">
                  <span id="gaugeRealtimeValue" class="text-3xl font-black text-emerald-600">Rp 0</span>
                  <span id="gaugeTargetValue" class="text-sm font-bold text-red-600 mt-2">Target: Rp 0</span>
                </div>
              </div>

              <div class="custom-table-container">
                <div class="bg-slate-900 text-white font-bold text-center py-2.5 rounded-t-xl">LIVE TOP SALES TODAY</div>
                <div class="flex-1 overflow-hidden relative border border-blue-200 rounded-b-xl bg-white">
                  <div id="scrollWrapper" class="absolute w-full animate-scroll-infinite">
                    <div id="tableContentOriginal" class="space-y-2 p-2"></div>
                    <div id="tableContentClone" class="space-y-2 p-2"></div>
                  </div>
                </div>
              </div>

              <div class="mtd-top1-container border-2 border-yellow-500">
                <div class="bg-slate-900 text-white font-bold text-center py-2.5">BEST SALES</div>
                <div class="flex-1 flex items-center justify-center p-4" id="mtdTop1Content">Memuat...</div>
              </div>
            </div>

            <div class="bottom-row">
              <div class="bottom-card-container">
                <div class="bg-slate-900 text-white text-xs font-bold text-center py-1.5">SALES DEPARTEMEN TODAY</div>
                <div class="flex-1 overflow-hidden relative bg-white">
                  <div id="scrollWrapperDept" class="absolute w-full animate-scroll-infinite">
                    <div id="tableContentOriginalDept" class="space-y-1 p-2"></div>
                  </div>
                </div>
              </div>
              <div class="bottom-card-container"><div class="bg-slate-900 text-white text-xs font-bold text-center py-1.5">MTD BY SALES</div></div>
              <div class="bottom-card-container"><div class="bg-slate-900 text-white text-xs font-bold text-center py-1.5">MTD BY FURNIPRO</div></div>
              <div class="bottom-card-container"><div class="bg-slate-900 text-white text-xs font-bold text-center py-1.5">MTD BY COMSER</div></div>
            </div>
          </div>
        </main>

      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vxsopsnopeurnxdkfsbe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54ZGtmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function scaleDashboard() {
      const box = document.getElementById('tvAspectRatioBox');
      const canvas = document.getElementById('tvScaleCanvas');
      if (!box || !canvas) return;
      const scale = Math.min(box.clientWidth / 1920, box.clientHeight / 1080);
      canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', scaleDashboard);

    function unlockAndPlayAudio() {
      document.getElementById('audioUnlockOverlay').remove();
      syncBacksoundState();
    }

    // REALTIME MONITORING DENGAN DUA BUCKET / TABEL
    function setupRealtimeListeners() {
      // Monitor status Backsound (Card 1)
      supabaseClient
        .channel('public:status_backsound')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'status_backsound' }, () => {
          syncBacksoundState();
        })
        .subscribe();

      // Monitor Popup & Sound Twibbon (Card 2)
      supabaseClient
        .channel('public:popup_twibbon')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'popup_twibbon' }, payload => {
          if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
            triggerSalesPopup(payload.new);
          }
        })
        .subscribe();
    }

    async function syncBacksoundState() {
      const audioBacksound = document.getElementById('audioBacksound');
      const { data } = await supabaseClient.from('status_backsound').select('*').eq('bucket_name', 'BACKSOUND').maybeSingle();

      if (data && data.status_lagu === 'AKTIF' && data.nama_lagu) {
        const { data: pub } = supabaseClient.storage.from('BACKSOUND').getPublicUrl(data.nama_lagu);
        if (pub?.publicUrl) {
          if (audioBacksound.src !== pub.publicUrl) {
            audioBacksound.src = pub.publicUrl;
          }
          audioBacksound.play().catch(e => {});
        }
      } else {
        audioBacksound.pause();
      }
    }

    async function triggerSalesPopup(data) {
      if (!data) return;
      const overlay = document.getElementById('salesPopupOverlay');
      const audioBacksound = document.getElementById('audioBacksound');
      const audioSoundSales = document.getElementById('audioSoundSales');

      document.getElementById('popupFoto').src = `${SUPABASE_URL}/storage/v1/object/public/FOTO SALES/${data.nip}.jpg`;
      document.getElementById('popupNama').innerText = data.nama || '-';
      document.getElementById('popupNip').innerText = `NIP: ${data.nip}`;
      document.getElementById('popupValueSales').innerText = data.value || '-';
      document.getElementById('popupQtyFp').innerText = data.qtyfp || '-';
      document.getElementById('popupValueComser').innerText = data.valuecnc || '-';

      // Jeda lagu Backsound Card 1
      audioBacksound.pause();

      // Putar Lagu Sound Sales jika Card 2 AKTIF
      const { data: soundData } = await supabaseClient
        .from('status_soundtwibbon')
        .select('*')
        .eq('bucket_nametw', 'SOUND SALES')
        .eq('status_lagutw', 'AKTIF')
        .maybeSingle();

      if (soundData && soundData.nama_lagutw) {
        const { data: pubSound } = supabaseClient.storage.from('SOUND SALES').getPublicUrl(soundData.nama_lagutw);
        if (pubSound?.publicUrl) {
          audioSoundSales.src = pubSound.publicUrl;
          audioSoundSales.play().catch(e => {});
        }
      }

      overlay.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
      overlay.classList.add('opacity-100', 'scale-100');

      setTimeout(async () => {
        overlay.classList.remove('opacity-100', 'scale-100');
        overlay.classList.add('opacity-0', 'pointer-events-none', 'scale-95');

        audioSoundSales.pause();
        audioSoundSales.currentTime = 0;
        
        // Lanjutkan Backsound jika posisinya aktif
        syncBacksoundState();
      }, 5000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      scaleDashboard();
      setupRealtimeListeners();
      
      setInterval(() => {
        const now = new Date();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID');
        document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }, 1000);
    });
  </script>
</body>
</html>
