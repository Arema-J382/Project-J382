<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Dashboard - Input Data</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-slate-200 flex flex-col shrink-0">
    <div class="p-5 font-bold text-lg text-white border-b border-slate-800 flex items-center gap-2">
      <i data-lucide="layout-dashboard" class="w-5 h-5 text-blue-400"></i>
      <span>ADMIN PANEL</span>
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
      <div>
        <button onclick="toggleMenu('submenuTv')" class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition text-left font-semibold text-slate-100">
          <div class="flex items-center gap-3">
            <i data-lucide="tv" class="w-5 h-5 text-blue-400"></i>
            <span>TV DASHBOARD</span>
          </div>
          <i data-lucide="chevron-down" id="arrowTv" class="w-4 h-4 transition-transform duration-200 rotate-180"></i>
        </button>
        
        <div id="submenuTv" class="pl-9 mt-1 space-y-1">
          <a href="#" class="block p-2 rounded-md bg-slate-800 text-sm text-blue-300 font-medium flex items-center gap-2">
            <i data-lucide="table" class="w-4 h-4"></i>
            <span>DAILY SALES</span>
          </a>
        </div>
      </div>
    </nav>
  </aside>

  <!-- CONTENT AREA -->
  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
      <h1 class="text-xl font-bold text-gray-800">TV DASHBOARD / DAILY SALES</h1>
      <span class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">Excel Paste Sync</span>
    </header>

    <section class="p-6 flex-1 flex flex-col">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col">
        
        <div class="flex justify-between items-center mb-4">
          <div>
            <h2 class="text-lg font-bold text-gray-800">Lembar Kerja Data Penjualan</h2>
            <p class="text-sm text-gray-500">Klik kotak di bawah, lalu tekan <b>Ctrl + V</b> untuk menempelkan data dari Excel[cite: 8].</p>
          </div>
          <div class="flex gap-2">
            <button onclick="resetData()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-lg text-sm border flex items-center gap-1">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset / Kosongkan
            </button>
            <button id="btnKirim" onclick="kirimKeSupabase()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg text-sm flex items-center gap-2 transition hidden">
              <i data-lucide="send" class="w-4 h-4"></i> Kirim <span id="totalBaris">0</span> Baris ke Supabase
            </button>
          </div>
        </div>

        <!-- Notifikasi -->
        <div id="statusMsg" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- KOTAK AREA PASTE -->
        <div class="mb-4">
          <textarea id="excelPasteInput" placeholder="Tekan Ctrl + V di sini untuk paste data Excel..." 
            class="w-full h-24 p-3 border-2 border-dashed border-blue-400 bg-blue-50/50 rounded-xl focus:outline-none focus:border-blue-600 text-sm font-mono"
            onpaste="handleExcelPaste(event)"></textarea>
        </div>

        <!-- TABEL UTAMA (DATA MUNCUL TEPAT DI BAWAH HEADER) -->
        <div class="flex-1 border border-gray-300 rounded-lg overflow-auto bg-white max-h-[450px] shadow-inner">
          <table class="w-full border-collapse text-left text-sm">
            <thead class="bg-slate-800 text-white sticky top-0 z-10">
              <tr>
                <th class="border border-slate-600 px-4 py-2.5 w-16 text-center">NO</th>
                <th class="border border-slate-600 px-4 py-2.5">NIP</th>
                <th class="border border-slate-600 px-4 py-2.5">NAMA</th>
                <th class="border border-slate-600 px-4 py-2.5 w-32">DEPT</th>
                <th class="border border-slate-600 px-4 py-2.5 text-right">TOTAL</th>
              </tr>
            </thead>
            <tbody id="previewTableBody" class="divide-y divide-gray-200">
              <tr>
                <td colspan="5" class="text-center py-12 text-gray-400 italic">
                  Belum ada data. Silakan paste data dari Excel ke kotak di atas.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <script>
    // Konfigurasi Supabase (URL sudah disesuaikan ke domain utama Anda)
    const SUPABASE_URL = 'https://vxsopsnopeurnxdkfsbe.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54ZGtmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus'; // Ganti dengan anon key Anda dari Project Settings -> API

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    function toggleMenu(id) {
      const menu = document.getElementById(id);
      const arrow = document.getElementById('arrowTv');
      menu.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    let parsedData = [];

    function handleExcelPaste(e) {
      setTimeout(() => {
        const pastedText = document.getElementById('excelPasteInput').value;
        if (!pastedText.trim()) return;

        const rows = pastedText.split('\n');
        parsedData = [];

        rows.forEach((row, index) => {
          if (!row.trim()) return;
          const cols = row.split('\t');

          let nip = cols[0] ? cols[0].trim() : '';
          let nama = cols[1] ? cols[1].trim() : '';
          let dept = cols[2] ? cols[2].trim() : '';
          let totalStr = cols[3] ? cols[3].trim().replace(/,/g, '') : '0';

          if (index === 0 && (nip.toUpperCase() === 'NIP' || nama.toUpperCase() === 'NAMA')) {
            return;
          }

          parsedData.push({
            nip: nip || '0',       // Mencegah error null constraint jika kolom NIP kosong
            nama: nama || 'NONAME',
            dept: dept || 'NODEPT',
            total: Number(totalStr) || 0
          });
        });

        renderTableRows();
      }, 100);
    }

    function renderTableRows() {
      const tbody = document.getElementById('previewTableBody');
      const btnKirim = document.getElementById('btnKirim');
      const totalBarisSpan = document.getElementById('totalBaris');

      if (parsedData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-400 italic">Data tidak valid. Pastikan format copy benar.</td></tr>`;
        btnKirim.classList.add('hidden');
        return;
      }

      let html = '';
      parsedData.forEach((item, idx) => {
        html += `
          <tr class="hover:bg-blue-50/50 transition">
            <td class="border border-gray-300 px-4 py-2 text-center text-gray-500 bg-gray-50">${idx + 1}</td>
            <td class="border border-gray-300 px-4 py-2 font-mono">${item.nip}</td>
            <td class="border border-gray-300 px-4 py-2 font-medium text-gray-800">${item.nama}</td>
            <td class="border border-gray-300 px-4 py-2 text-center font-semibold text-blue-600">${item.dept}</td>
            <td class="border border-gray-300 px-4 py-2 text-right font-mono">${item.total.toLocaleString('id-ID')}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      totalBarisSpan.innerText = parsedData.length;
      btnKirim.classList.remove('hidden');
    }

    function resetData() {
      parsedData = [];
      document.getElementById('excelPasteInput').value = '';
      document.getElementById('previewTableBody').innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-400 italic">Belum ada data. Silakan paste data dari Excel ke kotak di atas.</td></tr>`;
      document.getElementById('btnKirim').classList.add('hidden');
      document.getElementById('statusMsg').classList.add('hidden');
    }

    async function kirimKeSupabase() {
      if (parsedData.length === 0) return;

      const statusMsg = document.getElementById('statusMsg');
      const btnKirim = document.getElementById('btnKirim');

      btnKirim.disabled = true;
      btnKirim.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Mengirim...';

      const { data, error } = await supabaseClient
        .from('laporan_departemen')
        .insert(parsedData);

      btnKirim.disabled = false;
      btnKirim.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Kirim ${parsedData.length} Baris ke Supabase`;
      lucide.createIcons();

      if (error) {
        statusMsg.className = 'mb-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700';
        statusMsg.innerText = 'Gagal menyimpan ke Supabase: ' + error.message;
        statusMsg.classList.remove('hidden');
      } else {
        statusMsg.className = 'mb-4 p-3 rounded-lg text-sm font-medium bg-green-100 text-green-700';
        statusMsg.innerText = `Sukses! ${parsedData.length} baris data berhasil dikirim dan disimpan ke Supabase!`;
        statusMsg.classList.remove('hidden');
        resetData();
      }
    }
  </script>
</body>
</html>
