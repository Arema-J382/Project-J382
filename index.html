<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Dashboard - Input Data</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Handsontable CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-slate-200 flex flex-col shrink-0">
    <div class="p-5 font-bold text-lg text-white border-b border-slate-800 flex items-center gap-2">
      <i data-lucide="layout-dashboard" class="w-5 h-5 text-blue-400"></i>
      <span>ADMIN PANEL</span>
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
      <div>
        <button id="btnTvDashboard" onclick="toggleMenu('submenuTv')" class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition text-left font-semibold text-slate-100">
          <div class="flex items-center gap-3">
            <i data-lucide="tv" class="w-5 h-5 text-blue-400"></i>
            <span>TV DASHBOARD</span>
          </div>
          <i data-lucide="chevron-down" id="arrowTv" class="w-4 h-4 transition-transform duration-200 rotate-180"></i>
        </button>
        
        <div id="submenuTv" class="pl-9 mt-1 space-y-1">
          <a href="#" class="block p-2 rounded-md bg-slate-800 text-sm text-blue-300 font-medium flex items-center gap-2">
            <i data-lucide="table" class="w-4 h-4"></i>
            <span>DAILY SALES</span>
          </a>
        </div>
      </div>
    </nav>
  </aside>

  <!-- CONTENT AREA -->
  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
      <h1 id="pageTitle" class="text-xl font-bold text-gray-800">TV DASHBOARD / DAILY SALES</h1>
      <span class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">Bulk Data Paste</span>
    </header>

    <section class="p-8 flex-1 flex flex-col">
      <div id="daily-sales-view" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col">
        
        <div class="flex justify-between items-center mb-4">
          <div>
            <h2 class="text-lg font-bold text-gray-800">Lembar Input Penjualan</h2>
            <p class="text-sm text-gray-500">Silakan <b>Copy data dari Excel</b> lalu klik sel pertama di bawah dan tekan <b>Ctrl + V</b>.</p>
          </div>
          <div class="flex gap-2">
            <button onclick="tambahBaris()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-3 py-2 rounded-lg text-sm border flex items-center gap-1">
              <i data-lucide="plus" class="w-4 h-4"></i> Tambah 100 Baris
            </button>
            <button id="btnKirim" onclick="kirimKeSupabase()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg text-sm flex items-center gap-2 transition">
              <i data-lucide="send" class="w-4 h-4"></i> Kirim Semua ke Supabase
            </button>
          </div>
        </div>

        <!-- Notifikasi -->
        <div id="statusMsg" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- Container Tabel Excel Dinamis -->
        <div class="border rounded-lg overflow-hidden flex-1">
          <div id="excelGrid" class="w-full h-full"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 1. MASUKKAN SUPABASE URL DAN ANON KEY ANDA DI SINI
    const SUPABASE_URL = 'vxsopsnopeurnxdkfsbe'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54ZGtmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    lucide.createIcons();

    function toggleMenu(id) {
      const menu = document.getElementById(id);
      const arrow = document.getElementById('arrowTv');
      menu.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    // Inisialisasi awal 100 baris kosong (cukup ringan & bisa menampung banyak data)
    const initialData = Array.from({ length: 100 }, () => ['', '', '', '']);

    const container = document.getElementById('excelGrid');
    const hot = new Handsontable(container, {
      data: initialData,
      colHeaders: ['NIP', 'NAMA', 'DEPT', 'TOTAL'],
      columns: [
        { type: 'text' },
        { type: 'text' },
        { type: 'text' },
        { type: 'numeric', numericFormat: { pattern: '0,0' } }
      ],
      rowHeaders: true,
      height: '500px', // Tinggi tabel agar pas di layar
      minSpareRows: 1, // Otomatis menambah baris baru jika mencapai bagian bawah
      stretchH: 'all',
      contextMenu: true,
      licenseKey: 'non-commercial-and-evaluation'
    });

    function tambahBaris() {
      hot.alter('insert_row_below', hot.countRows() - 1, 100);
    }

    async function kirimKeSupabase() {
      const rawData = hot.getData();
      const payload = [];

      rawData.forEach(row => {
        const nip = row[0] ? String(row[0]).trim() : null;
        const nama = row[1] ? String(row[1]).trim() : null;
        const dept = row[2] ? String(row[2]).trim() : null;
        const total = row[3] !== null && row[3] !== '' ? Number(row[3]) : null;

        if (nama || dept || total !== null || nip) {
          payload.push({
            nip: nip,
            nama: nama || 'NONAME',
            dept: dept || '-',
            total: total || 0
          });
        }
      });

      const statusMsg = document.getElementById('statusMsg');
      const btnKirim = document.getElementById('btnKirim');

      if (payload.length === 0) {
        statusMsg.className = 'mb-4 p-3 rounded-lg text-sm font-medium bg-yellow-100 text-yellow-800';
        statusMsg.innerText = 'Tidak ada data untuk dikirim! Silakan paste atau isi tabel terlebih dahulu.';
        statusMsg.classList.remove('hidden');
        return;
      }

      btnKirim.disabled = true;
      btnKirim.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Mengirim Data...';

      // Kirim secara bertahap / sekaligus ke Supabase
      const { data, error } = await supabaseClient
        .from('laporan_departemen')
        .insert(payload);

      btnKirim.disabled = false;
      btnKirim.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Kirim Semua ke Supabase';
      lucide.createIcons();

      if (error) {
        statusMsg.className = 'mb-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700';
        statusMsg.innerText = 'Gagal menyimpan data: ' + error.message;
        statusMsg.classList.remove('hidden');
      } else {
        statusMsg.className = 'mb-4 p-3 rounded-lg text-sm font-medium bg-green-100 text-green-700';
        statusMsg.innerText = `Berhasil menyimpan ${payload.length} baris data ke Supabase!`;
        statusMsg.classList.remove('hidden');

        hot.loadData(Array.from({ length: 100 }, () => ['', '', '', '']));
      }
    }
  </script>
</body>
</html>
